name: LINE repair backlog reminder
on:
  schedule:
    # 08:00 Asia/Bangkok (UTC+7), Monday-Friday
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Send LINE reminder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          REPAIR_DESK_URL: ${{ secrets.REPAIR_DESK_URL }}
        run: node scripts/send-line-repair-reminder.mjs
